name: 証明のゲート

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    # テンプレートそのもの（Lean のライブラリがまだない）では走らせない
    if: hashFiles('lakefile.toml', 'lakefile.lean') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: 証明のゲート（spec/check.sh）
        run: bash spec/check.sh
