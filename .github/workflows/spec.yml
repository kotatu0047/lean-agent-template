name: 証明のゲート

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # テンプレートそのもの（Lean のライブラリがまだない）では、ここから先を飛ばす
      - id: lib
        run: |
          if [ -f lakefile.toml ] || [ -f lakefile.lean ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.lib.outputs.found == 'true'
        uses: leanprover/lean-action@v1
      - if: steps.lib.outputs.found == 'true'
        name: 証明のゲート（spec/check.sh）
        run: bash spec/check.sh
